
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBU UCZ Fellowship — Member Registration</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Page Header -->
  <header class="header-banner">

    <div class="header-container">

      <img src="images/cbu logo.png"
           alt="CBU Logo"
           class="logo logo-left">

      <div class="header-title">
        <h1>CBU UCZ FELLOWSHIP</h1>
        <p>2026/2027 Academic Year — Member Registration</p>
      </div>

      <img src="images/ucz logo.png"
           alt="UCZ Logo"
           class="logo logo-right">

    </div>

  </header>

  <!-- Main Content -->
  <main class="container">

    <section class="card" aria-labelledby="registration-heading">

      <h2 id="registration-heading">
        Register Membership
      </h2>


      <!-- Registration Form -->
      <form id="registrationForm">

        <div class="form-group">
          <label for="firstName">
            First Name *
          </label>

          <input type="text"
                 id="firstName"
                 required>
        </div>


        <div class="form-group">
          <label for="lastName">
            Last Name *
          </label>

          <input type="text"
                 id="lastName"
                 required>
        </div>


        <div class="form-group">
          <label for="phone">
            Phone Number (WhatsApp) *
          </label>

          <input type="tel"
                 id="phone"
                 required>
        </div>


        <div class="form-group">

          <label>
            Date of Birth *
          </label>

          <div style="display: flex; gap: 10px;">

            <select id="dobMonth"
                    required
                    style="flex: 2;">

              <option value="">
                Month...
              </option>

              <option value="01">January</option>
              <option value="02">February</option>
              <option value="03">March</option>
              <option value="04">April</option>
              <option value="05">May</option>
              <option value="06">June</option>
              <option value="07">July</option>
              <option value="08">August</option>
              <option value="09">September</option>
              <option value="10">October</option>
              <option value="11">November</option>
              <option value="12">December</option>

            </select>


            <input type="number"
                   id="dobDay"
                   placeholder="Day"
                   min="1"
                   max="31"
                   required
                   style="flex: 1;">


            <input type="number"
                   id="dobYear"
                   placeholder="Year (Optional)"
                   min="1950"
                   max="2015"
                   style="flex: 1.5;">

          </div>

        </div>


        <div class="form-group">

          <label for="programme">
            Programme of Study *
          </label>

          <input type="text"
                 id="programme"
                 required>

        </div>


        <div class="form-group">

          <label for="yearOfStudy">
            Year of Study *
          </label>

          <select id="yearOfStudy" required>

            <option value="">
              Select Year...
            </option>

            <option value="1">1st Year</option>
            <option value="2">2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
            <option value="5">5th Year</option>

          </select>

        </div>


        <div class="form-group">

          <label for="residence">
            Current Residence *
          </label>

          <input type="text"
                 id="residence"
                 required
                 placeholder="e.g. Campus(H215), Ngozi Street #6754, Frazer Crescent #28">

        </div>


        <button type="submit"
                class="btn"
                style="width: 100%;">
          Submit Registration
        </button>

      </form>


      <!-- Form Status -->
      <div id="statusMessage"
           style="margin-top: 15px; text-align: center;">
      </div>

    </section>

  </main>


  <!-- Page Footer -->
  <footer>
    <div class="container">
      <p>CBU UCZ Fellowship &copy; 2026/2027</p>
      <p>Member Registration System</p>
    </div>
  </footer>


  <!-- Registration JavaScript -->
  <script src="js/register.js"></script>

</body>
</html>
```
