<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CBU UCZ Fellowship — Secretary Login</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div
      id="appToast"
      class="toast"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <header class="header-banner">
      <div class="header-container">
        <img src="images/cbu-logo.png" alt="CBU Logo" class="logo logo-left" />

        <div class="header-title">
          <h1>CBU UCZ FELLOWSHIP</h1>
          <p>Secretary Login</p>
        </div>

        <img src="images/ucz-logo.png" alt="UCZ Logo" class="logo logo-right" />
      </div>
    </header>

    <main class="container login-container">
      <section class="login-card" aria-labelledby="login-heading">
        <h2 id="login-heading">Secretary Access</h2>

        <form id="loginForm">
          <div>
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              required
              placeholder="secretary@domain.com"
            />
          </div>

          <div>
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              required
              placeholder="Enter password"
            />
          </div>

          <div class="login-actions">
            <button type="submit" id="loginSubmitBtn" class="btn">Login</button>
            <button
              type="button"
              id="forgotPasswordBtn"
              class="btn btn-accent btn-sm"
            >
              Forgot password?
            </button>
          </div>
        </form>

        <div
          id="statusMessage"
          class="status-text"
          aria-live="polite"
          aria-atomic="true"
        ></div>
      </section>
    </main>

    <script src="firebase-config.js"></script>
    <script type="module" src="js/login.js"></script>
  </body>
</html>
